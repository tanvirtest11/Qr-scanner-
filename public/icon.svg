<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Safe Zone Padding for Maskable Icons -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>

  <!-- Outer Rounded Frame -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Scanning Viewfinder Corners -->
  <path d="M 120 160 L 120 130 Q 120 120 130 120 L 160 120" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
  <path d="M 392 160 L 392 130 Q 392 120 382 120 L 352 120" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
  <path d="M 120 352 L 120 382 Q 120 392 130 392 L 160 392" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
  <path d="M 392 352 L 392 382 Q 392 392 382 392 L 352 392" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>

  <!-- QR Pattern Elements (Top-Left Position Finder) -->
  <rect x="156" y="156" width="76" height="76" rx="14" fill="none" stroke="#10b981" stroke-width="14"/>
  <rect x="178" y="178" width="32" height="32" rx="6" fill="#34d399"/>

  <!-- Top-Right Position Finder -->
  <rect x="280" y="156" width="76" height="76" rx="14" fill="none" stroke="#10b981" stroke-width="14"/>
  <rect x="302" y="178" width="32" height="32" rx="6" fill="#34d399"/>

  <!-- Bottom-Left Position Finder -->
  <rect x="156" y="280" width="76" height="76" rx="14" fill="none" stroke="#10b981" stroke-width="14"/>
  <rect x="178" y="302" width="32" height="32" rx="6" fill="#34d399"/>

  <!-- QR Data Bits -->
  <rect x="280" y="280" width="28" height="28" rx="6" fill="#10b981"/>
  <rect x="328" y="280" width="28" height="28" rx="6" fill="#34d399"/>
  <rect x="280" y="328" width="28" height="28" rx="6" fill="#34d399"/>
  <rect x="328" y="328" width="28" height="28" rx="6" fill="#10b981"/>
  <rect x="244" y="244" width="24" height="24" rx="5" fill="#34d399"/>

  <!-- Center Laser Scan Line with Glow -->
  <line x1="120" y1="256" x2="392" y2="256" stroke="#34d399" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
</svg>
